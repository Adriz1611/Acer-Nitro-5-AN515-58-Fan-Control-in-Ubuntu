name: Build Debian Package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set package version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0+git$(date -u +%Y%m%d%H%M%S).${GITHUB_SHA::7}"
          fi
          ARCH="$(dpkg --print-architecture)"
          DEB_PATH="dist/nitrosense-gui_${VERSION}_${ARCH}.deb"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "arch=${ARCH}" >> "$GITHUB_OUTPUT"
          echo "deb_path=${DEB_PATH}" >> "$GITHUB_OUTPUT"

      - name: Build package
        shell: bash
        run: |
          chmod +x nitrosense-admin nitrosense nitrosense-gui
          ./nitrosense-admin build-deb "${{ steps.meta.outputs.version }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nitrosense-gui-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.arch }}
          path: ${{ steps.meta.outputs.deb_path }}

      - name: Upload release asset (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.meta.outputs.deb_path }}
          generate_release_notes: true
